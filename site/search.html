<script>
// Search the collection from the landing page.
//
// Quarto indexes every deck it renders into `search.json` -- one entry per
// slide, so a half-remembered line leads to the slide that sings it and not
// merely to the hymn. Nothing here builds that index; this only reads it. The
// two pages are not in it: `theme: none` leaves Quarto no content wrapper to
// index, and neither page holds a line anyone would search for.
//
// The index is a few megabytes, so it is fetched when someone first reaches
// for the field rather than on every visit. The form is in the generated
// index; this is inert on the pages that do not carry one.
(function () {
  var form = document.getElementById('hymn-search');
  if (!form) return;
  var input = document.getElementById('hymn-query');
  var status = document.getElementById('hymn-search-status');
  var results = document.getElementById('hymn-search-results');
  var entries = null;
  var loading = null;
  var timer = null;
  // Enough to show that a word is common without paging through 848 hymns.
  var LIMIT = 50;

  // The collection is typeset with curly quotes; a keyboard types straight
  // ones. Both sides pass through here so the two meet. Every substitution is
  // one character for one, which keeps offsets into the normalized text usable
  // against the original.
  function normalize(text) {
    return text.toLowerCase().replace(/[‘’]/g, "'").replace(/[“”]/g, '"');
  }

  function load() {
    if (loading) return loading;
    loading = fetch('search.json')
      .then(function (response) {
        if (!response.ok) throw new Error('search.json: ' + response.status);
        return response.json();
      })
      .then(function (raw) {
        entries = raw.map(function (entry) {
          var href = entry.href || '';
          var page = href.split('#')[0];
          var number = /^slide\/([0-9]+)\.html$/.exec(page);
          var title = entry.title || '';
          var text = entry.text || '';
          return {
            href: href,
            page: page,
            number: number ? parseInt(number[1], 10) : null,
            title: title,
            section: entry.section || '',
            text: text,
            title_key: normalize(title),
            key: normalize(title + '\n' + (entry.section || '') + '\n' + text)
          };
        });
        return entries;
      });
    return loading;
  }

  // Every term has to appear, and a hymn named by them outranks one that only
  // sings them somewhere.
  function rank(terms) {
    var best = {};
    var order = [];
    entries.forEach(function (entry) {
      for (var i = 0; i < terms.length; i++) {
        if (entry.key.indexOf(terms[i]) < 0) return;
      }
      var named = true;
      for (var j = 0; j < terms.length; j++) {
        if (entry.title_key.indexOf(terms[j]) < 0) { named = false; break; }
      }
      var score = named ? 0 : 1;
      var held = best[entry.page];
      if (held === undefined) {
        best[entry.page] = {entry: entry, score: score};
        order.push(entry.page);
      } else if (score < held.score) {
        held.entry = entry;
        held.score = score;
      }
    });
    return order
      .map(function (page) { return best[page]; })
      .sort(function (a, b) {
        if (a.score !== b.score) return a.score - b.score;
        if (a.entry.number === null) return 1;
        if (b.entry.number === null) return -1;
        return a.entry.number - b.entry.number;
      });
  }

  // The line a term was found in, rather than a window of a fixed width: what
  // is indexed is lyrics, and a lyric line is the unit someone half-remembers.
  function line(entry, terms) {
    var key = normalize(entry.text);
    for (var i = 0; i < terms.length; i++) {
      var at = key.indexOf(terms[i]);
      if (at < 0) continue;
      var start = key.lastIndexOf('\n', at) + 1;
      var end = key.indexOf('\n', at);
      if (end < 0) end = entry.text.length;
      return {
        text: entry.text.slice(start, end),
        from: at - start,
        length: terms[i].length
      };
    }
    return null;
  }

  function render(found, terms) {
    results.textContent = '';
    found.slice(0, LIMIT).forEach(function (hit) {
      var entry = hit.entry;
      var item = document.createElement('li');

      var link = document.createElement('a');
      link.href = entry.href;
      link.target = '_blank';
      link.rel = 'noopener';
      link.textContent = (entry.number === null ? '' : entry.number + ' · ') + entry.title;
      item.appendChild(link);

      if (entry.section) {
        var section = document.createElement('span');
        section.className = 'hymn-search-section';
        section.textContent = entry.section;
        item.appendChild(section);
      }

      var matched = line(entry, terms);
      if (matched) {
        var quote = document.createElement('p');
        quote.className = 'hymn-search-line';
        quote.appendChild(document.createTextNode(matched.text.slice(0, matched.from)));
        var mark = document.createElement('mark');
        mark.textContent = matched.text.slice(matched.from, matched.from + matched.length);
        quote.appendChild(mark);
        quote.appendChild(document.createTextNode(matched.text.slice(matched.from + matched.length)));
        item.appendChild(quote);
      }

      results.appendChild(item);
    });
  }

  function say(text) {
    status.textContent = text;
    status.hidden = !text;
  }

  function search() {
    var terms = normalize(input.value).split(/\s+/).filter(Boolean);
    if (!terms.length) {
      results.textContent = '';
      say('');
      return;
    }
    load().then(function () {
      // A slower fetch than the typing it was started by: only the last query
      // typed should answer.
      if (normalize(input.value).split(/\s+/).filter(Boolean).join(' ') !== terms.join(' ')) return;
      var found = rank(terms);
      render(found, terms);
      say(found.length === 0
        ? 'Nothing found 沒有結果'
        : found.length > LIMIT
          ? found.length + ' hymns — showing the first ' + LIMIT
          : found.length + (found.length === 1 ? ' hymn' : ' hymns'));
    }).catch(function (error) {
      results.textContent = '';
      say('Search is unavailable 搜尋無法使用');
      if (window.console) console.error(error);
    });
  }

  input.addEventListener('focus', load, {once: true});
  input.addEventListener('input', function () {
    clearTimeout(timer);
    timer = setTimeout(search, 150);
  });
  form.addEventListener('submit', function (event) {
    event.preventDefault();
    clearTimeout(timer);
    search();
  });
})();
</script>
