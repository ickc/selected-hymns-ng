[project]
authors = [{name = "Kolen Cheung", email = "10970208+ickc@users.noreply.github.com"}]
dependencies = ["panflute>=2.0.5,<3", "PyYAML>=6,<7"]
name = "hymn_projection"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64"]

[tool.pixi.pypi-dependencies]
hymn_projection = { path = ".", editable = true }

[tool.pixi.tasks]
yaml-to-md = "python -m hymn_projection.converter yaml-to-markdown ../selected-hymns/data.yml data"
md-to-yaml = "python -m hymn_projection.converter markdown-to-yaml data data.yml"
md-to-slide = "python -m hymn_projection.converter markdown-to-slides data site/slide"
test = "python -m unittest discover -s tests -v"

[tool.pixi.dependencies]
pandoc = ">=3.8.3,<4"
quarto = ">=1.9.38,<2"
panflute = ">=2.0.5,<3"
pyyaml = ">=6,<7"
